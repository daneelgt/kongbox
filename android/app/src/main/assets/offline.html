<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>KONGBOX</title>
<style>
html, body { margin: 0; height: 100%; background: #000; color: #f5f5f7; font: 15px/1.4 -apple-system, Roboto, system-ui, sans-serif; overflow: hidden; }
body { display: grid; place-items: center; text-align: center; }
.logo { font: 800 44px/1 -apple-system, Roboto, sans-serif; letter-spacing: -.04em; }
.logo i { font-style: normal; color: #30d158; animation: b 1.1s steps(1) infinite; }
@keyframes b { 50% { opacity: 0; } }
p { color: rgba(235,235,245,.6); max-width: 440px; margin: 18px auto 0; padding: 0 20px; }
code { font: 13px "Droid Sans Mono", monospace; color: #64d2ff; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff9f0a; margin-right: 6px; animation: p 1.6s ease-in-out infinite; }
@keyframes p { 50% { opacity: .25; } }
</style>
</head>
<body>
<div>
  <div class="logo">KONGBOX<i>_</i></div>
  <p><span class="dot"></span>procurando o agente no PC…</p>
  <p>Ligue o cabo USB com a depuração USB ativa e deixe o <code>KongBoxAgent</code> aberto. O painel volta sozinho.</p>
</div>
</body>
</html>
